# Server Configuration
server.port=8080
server.servlet.context-path=/
# Server configuration for network access
server.address=0.0.0.0
server.port=8080

# CORS configuration for frontend
app.cors.allowed-origins=http://localhost:5173,http://192.168.1.3:5173
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# Database Configuration - Oracle XE - Pure JDBC
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=system
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JDBC Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# SQL Initialization - Disabled
spring.sql.init.mode=never

# Logging Configuration - INCREASED FOR DEBUGGING
logging.level.com.eduportal=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.web=DEBUG

# CORS Configuration for Frontend
app.cors.allowed-origins=http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# JWT Configuration
app.jwt.secret=eduportal-secret-key-2024-spring-boot-jdbc-application-very-secure-key-here
app.jwt.expiration=86400000

# Application Settings
app.demo-mode=true
app.frontend-url=http://localhost:5173

# Server Settings
server.error.include-message=always
server.error.include-binding-errors=always
# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
